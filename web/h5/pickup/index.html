<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e5">
<title>文创取件 · 桂林之眼</title>
<link rel="stylesheet" href="../shared/ge.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="seal">取</div><div><h1>文创取件</h1><p>C-05 · 印章三态</p></div></div>
    <nav class="nav"><a href="../">返回</a></nav>
  </header>

  <section class="panel">
    <h2>选一件带走</h2>
    <p class="sub">四类商品一一对应。价格与支付由馆方收银系统确认，本页只生成取货码，处于演示态。</p>
    <div class="catalog" id="catalog"></div>
    <div class="field">
      <label>纹样</label>
      <div class="chips" id="patterns">
        <button class="chip on" data-pattern="tuanshan">团扇纹</button>
        <button class="chip" data-pattern="stone">石刻纹</button>
        <button class="chip" data-pattern="elephant">象山纹</button>
        <button class="chip" data-pattern="river">漓水纹</button>
      </div>
    </div>
    <div class="field">
      <label>颜色</label>
      <div class="chips" id="colors">
        <button class="chip on" data-color="shilv">石绿</button>
        <button class="chip" data-color="zhusha">朱砂</button>
      </div>
    </div>
    <div class="field">
      <label>尺寸</label>
      <div class="chips" id="sizes">
        <button class="chip" data-size="S">S</button>
        <button class="chip on" data-size="M">M</button>
        <button class="chip" data-size="L">L</button>
      </div>
    </div>
    <button class="btn row" id="order">生成取货码</button>
    <div class="result" id="result">
      <div style="font-size:12px;color:rgba(23,33,30,.55)">凭此码到厅外打印点</div>
      <div class="code" id="code">—</div>
      <div class="note" id="note"></div>
    </div>
  </section>

  <section class="panel">
    <h2>印章位</h2>
    <p class="sub">下单成功 → 纹样缩为印章停留 60 秒 → 前单内容补位。印章位 900×900，常驻 C-05 右侧。</p>
    <div class="flow">
      <div class="step on"><span class="n on">1</span><div><b>选纹样</b> 团扇 / 石刻 / 象山 / 漓水。</div></div>
      <div class="step"><span class="n">2</span><div><b>落章</b> 选色与尺寸，确认后纹样缩为印章。</div></div>
      <div class="step"><span class="n">3</span><div><b>停留</b> 60 秒展示，附取货码。</div></div>
      <div class="step"><span class="n">4</span><div><b>补位</b> 下一单覆盖，队列顺延。</div></div>
    </div>
  </section>

  <p class="foot">接口：/api/v1/c05/catalog、/c05/orders。正式环境需接入馆方收银、库存与打印点，价格不得由前端虚构。</p>
</div>
<script src="../shared/ge.js"></script>
<script src="pickup.js"></script>
</body>
</html>
